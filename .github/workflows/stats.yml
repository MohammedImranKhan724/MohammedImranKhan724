name: Update Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=MohammedImranKhan724&show_icons=true&theme=dark&hide_border=true&count_private=true&include_all_commits=true
          path: dist/stats.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=MohammedImranKhan724&layout=compact&theme=dark&hide_border=true&count_private=true
          path: dist/top-langs.svg
          token: ${{ secrets.GH_PAT }}

      - name: Push to stats-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
